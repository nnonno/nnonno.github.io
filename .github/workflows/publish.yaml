name: Deploy website to GitHub Pages

# The site is a plain static page in simple/ (no build step).
# The old Hugo site is kept in git history (last Hugo version: commit f067e26).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./simple
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
